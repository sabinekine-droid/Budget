function parseSearch(q) {
  const amt = [], words = [];
  for (const tok of String(q || "").toLowerCase().replace(/€/g, " ").replace(/\s+tot\s+/g, "-").split(/\s+/).filter(Boolean)) {
    let m;
    if ((m = tok.match(/^([<>]=?)(\d+(?:[.,]\d{1,2})?)$/))) { const v = +m[2].replace(",", "."); amt.push(m[1][0] === ">" ? [v, Infinity] : [0, v]); }

    else if ((m = tok.match(/^[-+]?(\d+)[.,](\d{1,2})$/))) { const v = +(m[1] + "." + m[2].padEnd(2, "0")); amt.push([v - 0.004, v + 0.004]); }
    else if ((m = tok.match(/^[-+]?(\d{1,6})$/)) && !/^\d{4}$/.test(tok)) { const v = +m[1]; amt.push([v, v + 0.999]); }

  return `<div class="newcat"><h2 style="font-size:16px">Nieuwe categorie</h2>

    <label>Soort<select id="ncType"><option value="out"${sheet.newCat.type === "out" ? " selected" : ""}>Uitgave</option><option value="in"${sheet.newCat.type === "in" ? " selected" : ""}>Inkomen</option><option value="neutral">Sparen / eigen rekening</option></select></label>
    <label>Trefwoorden (optioneel, met komma's)<input type="text" id="ncWords" placeholder="bv. schelck, de baere"></label>
    <div class="icon-pick">${Object.keys(ICON_LIB).map(k => `<label><input type="radio" name="ncIcon" value="${esc(k)}"${k === "Ster" ? " checked" : ""}><span class="ci">${P(ICON_LIB[k])}</span></label>`).join("")}</div>
    <p class="sub" id="ncErr" style="color:var(--crit-ink)"></p>
    <div class="btns" style="display:flex;gap:8px"><button class="btn primary" data-act="ncsave">Maken</button><button class="btn" data-act="nccancel">Annuleren</button></div></div>`;
}
function createCat() {
  const name = ($("ncName").value || "").trim().replace(/\s+/g, " "), type = $("ncType").value;
  const icon = (document.querySelector('input[name="ncIcon"]:checked') || {}).value || "Ster";
  const words = ($("ncWords").value || "").split(",").map(w => w.trim()).filter(Boolean).join(", ");
  if (!name) { $("ncErr").textContent = "Geef de categorie een naam."; return null; }
  if (allCats().some(c => c.id.toLowerCase() === name.toLowerCase())) { $("ncErr").textContent = "Die categorie bestaat al."; return null; }
  record({ kind: "customCat", value: { id: name, type, icon, words } });
  return name;
}
function sortGroups() {
  const target = view.sortKind === "in" ? "Overige inkomsten" : "Overige uitgaven", g = {};
  for (const t of S.tx) { if (catOf(t) !== target) continue; const k = cpKey(t); if (!k) continue; const o = g[k] || (g[k] = { key: k, label: cpLabel(t), n: 0, sum: 0, last: "", t }); o.n++; o.sum += Math.abs(t.amount); if (t.date > o.last) { o.last = t.date; o.t = t; } }
  return Object.values(g).sort((a, b) => b.sum - a.sum);
}
function renderSort() {
  const groups = sortGroups(), lim = view.sortLimit || 20, n = groups.reduce((a, x) => a + x.n, 0);
  return `<section class="card"><div class="seg2"><button data-sortkind="out" ${view.sortKind !== "in" ? 'aria-pressed="true"' : ""}>Uitgaven</button><button data-sortkind="in" ${view.sortKind === "in" ? 'aria-pressed="true"' : ""}>Inkomsten</button></div>
    <p class="sub" style="margin-top:8px">${groups.length ? n + " verrichtingen bij " + groups.length + " tegenpartijen staan nog onder Overige. Een keuze geldt voor alle verrichtingen van die tegenpartij." : "Alles is ingedeeld."}</p></section>
    ${groups.slice(0, lim).map(x => `<section class="card sortc"><button class="row" data-tx="${esc(x.t.id)}" style="border-top:0">${catIcon(catOf(x.t))}<span class="n">${esc(x.label)}</span><span class="m num">${fmtEUR0.format(x.sum)}</span><span class="s">${x.n}× · laatst ${fmtDate(x.last)}${x.t.desc ? " · " + esc(x.t.desc.split(" · ").slice(-1)[0]) : ""}</span></button>
      <select data-grp="${esc(x.key)}" aria-label="Categorie voor ${esc(x.label)}"><option value="">Kies een categorie…</option>${catOpts("", false)}<option value="__new">+ Nieuwe categorie…</option></select></section>`).join("")}
    ${groups.length > lim ? '<button class="btn block" data-act="sortmore">Meer tonen</button>' : ""}
    ${view.grpNew ? `<div class="sheet-back"><div class="sheet" role="dialog" aria-modal="true">${(sheet = sheet || { newCat: { type: view.sortKind === "in" ? "in" : "out" } }, newCatForm())}</div></div>` : ""}`;
}
function renderCats() {
  const typeName = { out: "Uitgave", in: "Inkomen", neutral: "Sparen" };
  return `<section class="card"><p class="sub">Voeg trefwoorden toe (met komma's), bv. de naam van een winkel. Verrichtingen met dat woord komen dan vanzelf in die categorie. Wordt bewaard en op de pc verwerkt.</p><button class="btn block" data-act="catnew" style="margin-top:8px">+ Nieuwe categorie</button></section>
  ${view.catNew ? `<section class="card">${(sheet = { newCat: { type: "out" } }, newCatForm())}</section>` : ""}
  <section class="card">${allCats().slice().sort((a, b) => a.id.localeCompare(b.id, "nl")).map(c => {
    const custom = S.customCats.find(x => x.id === c.id);
    const words = custom ? custom.words || "" : (S.catWords[c.id] || "");
    const n = S.tx.filter(t => catOf(t) === c.id).length;
    return `<div class="catrow">${catIcon(c.id)}<div><strong>${esc(c.id)}</strong><span class="sub"> · ${typeName[c.type]} · ${n}×${custom ? " · eigen" : ""}</span>
      <input type="text" data-kw="${esc(c.id)}" value="${esc(words)}" placeholder="trefwoorden" aria-label="Trefwoorden voor ${esc(c.id)}"></div></div>`; }).join("")}</section>`;
}
function render() {
  const el = $("app");
  if (screen === "start") el.innerHTML = renderStart();
  else if (screen === "folder") el.innerHTML = renderFolderScreen();
  else if (screen === "choose") el.innerHTML = renderChoose();
  else {
    const body = view.tab === "overzicht" ? renderOverzicht() : view.tab === "budget" ? renderBudget() : view.tab === "verrichtingen" ? renderTx() : view.tab === "indelen" ? renderSort() : view.tab === "categorieen" ? renderCats() : renderMeer();
    el.innerHTML = shell(body) + (sheet ? renderSheet() : "");
  }
}
// niet hertekenen terwijl iemand aan het typen is
let renderLater = false;
function softRender() { const a = document.activeElement; if (a && a.tagName === "INPUT") renderLater = true; else render(); }
document.addEventListener("focusout", () => { if (renderLater) setTimeout(() => { if (renderLater && document.activeElement.tagName !== "INPUT") { renderLater = false; render(); } }, 250); });
function changeCat(t, cat) {
  record({ kind: "category", id: t.id, value: cat });
  const key = cpKey(t), n = S.tx.filter(x => x.id !== t.id && cpKey(x) === key).length;
  if (key && n) sheet.ask = { kind: "cat", value: cat, key, n }; else { if (key) record({ kind: "categoryRule", key, value: cat }); sheet.ask = null; }
  render();
}
function changeTag(t, tg) {
  record({ kind: "tag", id: t.id, value: tg });
  const key = cpKey(t), n = S.tx.filter(x => x.id !== t.id && cpKey(x) === key).length;
  sheet.ask = key && n ? { kind: "tag", value: tg, key, n } : null;
  render();
}
async function guarded(fn) { try { await fn(); } catch (e) { problem = e instanceof NeedLogin ? "Tik opnieuw om aan te melden." : (e.message || "Dat is niet gelukt."); render(); } }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-tab],[data-act],[data-step],[data-gocat],[data-who],[data-tx],[data-choose],[data-sortkind]");
  if (e.target.dataset && e.target.dataset.close) { sheet = null; render(); return; }
  if (!b) return;
  const d = b.dataset;
  if (d.tab) { view.tab = d.tab; render(); scrollTo(0, 0); }
  else if (d.step) { const ms = allMonths(), i = ms.indexOf(view.period) + +d.step; if (ms[i]) { view.period = ms[i]; view.limit = 80; render(); } }
  else if (d.gocat) { view.cat = d.gocat; view.tag = ""; view.search = ""; view.limit = 80; view.tab = "verrichtingen"; render(); scrollTo(0, 0); }
  else if (d.who) { view.budgetWho = d.who; view.tab = "budget"; render(); scrollTo(0, 0); }
  else if (d.tx) { sheet = { id: d.tx, ask: null }; render(); }
  else if (d.sortkind) { view.sortKind = d.sortkind; view.sortLimit = 20; render(); }
  else if (d.act === "sortmore") { view.sortLimit = (view.sortLimit || 20) + 30; render(); }
  else if (d.act === "catnew") { view.catNew = true; render(); }
  else if (d.act === "nccancel") { if (view.grpNew) { view.grpNew = null; sheet = null; } else if (view.catNew) { view.catNew = false; sheet = null; } else if (sheet) sheet.newCat = null; render(); }
  else if (d.act === "ncsave") {
    const name = createCat(); if (!name) return;
    if (view.grpNew) { record({ kind: "categoryRule", key: view.grpNew, value: name }); view.grpNew = null; sheet = null; toast(name + " gemaakt en toegewezen."); }
    else if (view.catNew) { view.catNew = false; sheet = null; toast(name + " gemaakt."); }
    else if (sheet && sheet.id) { const x = S.tx.find(a => a.id === sheet.id); sheet.newCat = null; if (x) changeCat(x, name); toast(name + " gemaakt."); }
    render();
  }
  else if (d.choose != null) { const c = choices[+d.choose]; resetFolder(c.id, c.name); choices = null; persist(); sync(); }
  else if (d.act === "sync") sync();
  else if (d.act === "more") { view.limit += 100; render(); }
  else if (d.act === "closesheet") { sheet = null; render(); }
  else if (d.act === "always") { const a = sheet.ask, t = S.tx.find(x => x.id === sheet.id); record({ kind: a.kind === "cat" ? "categoryRule" : "tagRule", key: a.key, value: a.value }); sheet.ask = null; render(); if (t) toast("Ook de andere verrichtingen zijn aangepast."); }
  else if (d.act === "once") { sheet.ask = null; render(); }
  else if (d.act === "folder") { screen = "folder"; problem = ""; render(); }
  else if (d.act === "back") { screen = "app"; problem = ""; render(); }
  else if (d.act === "uselink") useFolderLink($("folderLink").value);
  else if (d.act === "logout") { if (st.queue.length) { if (!confirm(st.queue.length + " wijziging(en) zijn nog niet bewaard en gaan verloren. Toch afmelden?")) return; } logout(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "period") { view.period = t.value; view.limit = 80; render(); }
  else if (t.id === "who") { view.budgetWho = t.value; render(); }
  else if (t.id === "catF") { view.cat = t.value; view.limit = 80; $("txList").innerHTML = txRows(); }
  else if (t.id === "tagF") { view.tag = t.value; view.limit = 80; $("txList").innerHTML = txRows(); }
  else if (t.id === "sheetCat") { if (t.value === "__new") { const x = S.tx.find(a => a.id === sheet.id); sheet.newCat = { type: x && x.amount >= 0 ? "in" : "out" }; render(); return; } const x = S.tx.find(a => a.id === sheet.id); if (x) changeCat(x, t.value); }
  else if (t.dataset.grp) { if (!t.value) return; if (t.value === "__new") { view.grpNew = t.dataset.grp; sheet = null; render(); return; } record({ kind: "categoryRule", key: t.dataset.grp, value: t.value }); toast("Ingedeeld als " + t.value + "."); render(); }
  else if (t.dataset.kw) { const id = t.dataset.kw, v = t.value.split(",").map(w => w.trim()).filter(Boolean).join(", "); const cc = S.customCats.find(x => x.id === id); if (cc) record({ kind: "customCat", value: { ...cc, words: v } }); else record({ kind: "catWords", key: id, value: v }); toast("Trefwoorden bewaard."); }
  else if (t.id === "sheetTag") { const x = S.tx.find(a => a.id === sheet.id); if (x) changeTag(x, t.value); }
  else if (t.dataset.budget) {
    const v = parseFloat(String(t.value).replace(",", "."));
    const old = +S.budgets[t.dataset.budget] || 0, nw = v > 0 ? v : 0;
    if (nw !== old) { record({ kind: "budget", key: t.dataset.budget, value: nw }); renderLater = true; setTimeout(() => { if (renderLater && document.activeElement.tagName !== "INPUT") { renderLater = false; render(); } }, 250); }
  }
});
document.addEventListener("input", e => { if (e.target.id === "search") { view.search = e.target.value; view.limit = 80; $("txList").innerHTML = txRows(); } });
async function logout() {
  try { if (token && window.google) google.accounts.oauth2.revoke(token, () => {}); } catch (e) {}
  token = ""; tokenUntil = 0;
  await dbClear();
  st = { email: "", name: "", folderId: "", folderName: "", mainId: "", mainMod: "", base: null, others: {}, ownId: "", ownNextSeq: 1, own: [], queue: [], lastSync: "" };
  view = { tab: "overzicht", period: "", budgetWho: "", search: "", cat: "", tag: "", limit: 80 };
  screen = "start"; problem = ""; render();
}
window.addEventListener("online", () => { if (hasToken() && st.queue.length) sync(); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});

(async () => {
  try { const saved = await dbGet("state"); if (saved) st = { ...st, ...saved }; } catch (e) {}
  if (st.base) { screen = "app"; rebuild(); }
  render();
})();
</script>
</body>
</html>
